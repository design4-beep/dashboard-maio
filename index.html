<!DOCTYPE html>

      { nome: "masculino camiseta empatia manga longa ecotton b2b",      pct: 87,  val: "7,07%" },

  email: {

      { nome: "Adeus, jalecos sem graça", data: "22/05", enviados: 5177, entrega: "99,00%", abertura: "13,29%", cliques: "0,55%", bounces: 44,  status: "ok" },

  /* 📊 PERFORMANCE HISTÓRICA COMPLETA & COMPARATIVA */
  historico: {

    /* 🚀 NOVOS DADOS: Canais GA detalhados por mês para o comparativo */
    canaisPorMes: {
      direct:        [1002, 1026, 1810, 543, 1859],
      organicSearch: [615, 642, 1637, 578, 797],
      paidSearch:    [368, 1003, 1018, 332, 1986],

    }
  },

  /* 🚨 Alertas e Insights */
  alertas: [
    { situacao: "Mídia Paga (Paid Search) se tornou a maior fonte de acessos em Maio (1.986)", prioridade: "Estratégico",  badge: "blue",   acao: "Manter o impulsionamento focado em conversão direta" },
    { situacao: "Faturamento Omnichannel atingiu recorde de R$ 51.520,00",          prioridade: "Sucesso",     badge: "green",  acao: "Manter a estratégia de canais integrados de venda" },
    { situacao: "Captação disparou: 22 leads por Pop-up e 15 por WhatsApp",        prioridade: "Excelente",   badge: "green",  acao: "Otimizar fluxos de nutrição de e-mail para esses leads" },
    { situacao: "Visitas no Instagram subiram +93,3% (632) e interações +60,3% (383)", prioridade: "Positivo",    badge: "green",  acao: "Impulsionar formatos de Reels (lidera engajamento com 110)" },
    { situacao: "Receita direta na loja virtual caiu para R$ 760,40 (-85%)",       prioridade: "Crítico",     badge: "red",    acao: "Revisar fricção no checkout e ofertas exclusivas do site" },

</script>

<style>
  :root {
    --bg: #191919; --bg2: #222222; --bg3: #2a2a2a;
    --border: rgba(255,255,255,0.08); --text: #e8e8e6;
    --muted: #888; --faint: #555;
    --green: #1D9E75; --pink: #D4537E; --purple: #7F77DD;
    --blue: #378ADD; --amber: #EF9F27; --red: #E24B4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; font-size: 13px; padding: 24px; max-width: 1200px; margin: 0 auto; }
  .page-header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .page-header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .page-header p { color: var(--muted); font-size: 12px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpi-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media(max-width:768px) {
    .kpi-grid, .kpi-grid-2, .two-col { grid-template-columns: 1fr !important; }
  }
  .kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .kpi .label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .kpi .value { font-size: 24px; font-weight: 600; color: #fff; line-height: 1; }
  .kpi .delta { font-size: 11px; margin-top: 5px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .bar-row .lbl { flex: 0 0 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-val { flex: 0 0 70px; text-align: right; color: #fff; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { font-size: 10px; font-weight: 600; color: var(--faint); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.06em; text-transform: uppercase; }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-red    { background: rgba(226,75,74,0.15);   color: #f08080; }
  .badge-yellow { background: rgba(239,159,39,0.15);  color: #f0b060; }
  .badge-green  { background: rgba(29,158,117,0.15);  color: #5dcaa5; }
  .badge-blue   { background: rgba(55,138,221,0.15);  color: #85b7eb; }
  .badge-gray   { background: rgba(136,135,128,0.2);  color: #aaa;    }
  .badge-orange { background: rgba(239,100,39,0.2);   color: #f09060; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
  .chart-wrap { position: relative; width: 100%; height: 200px; }
  .chart-wrap-lg { position: relative; width: 100%; height: 280px; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); text-align: center; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const COR = { purple: 'var(--purple)', pink: 'var(--pink)', blue: 'var(--blue)', green: 'var(--green)', amber: 'var(--amber)' };

function kpi(label, obj) {
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${obj.valor}</div><div class="delta ${obj.tipo}">${obj.delta}</div></div>`;
}
function barRow(item) {
  const cor = COR[item.cor] || 'var(--purple)';
  return `<div class="bar-row"><span class="lbl">${item.nome}</span><div class="bar-track"><div class="bar-fill" style="width:${item.pct}%;background:${cor};"></div></div><span class="bar-val">${item.val}</span></div>`;
}

const D = DADOS;
const E = D.ecommerce, R = D.rd, H = D.historico;

document.getElementById('app').innerHTML = `
<div class="page-header">
  <h1>📊 Dashboard de Marketing Omnichannel — Consolidado 2026</h1>
  <p>Período Base: ${D.periodo} &nbsp;·&nbsp; Histórico Comparativo Atualizado</p>
</div>

<div class="section-title">⚖️ Comparativo de Origens de Tráfego Mês a Mês (Google Analytics)</div>
<div class="card" style="margin-bottom: 16px;">
  <div class="card-title">Distribuição Mensal por Canal de Entrada (Sessões Absolutas)</div>
  <div class="chart-wrap-lg"><canvas id="canaisComparativoChart"></canvas></div>
</div>

<div class="section-title">🛒 E-commerce — Tray &amp; Visão Consolidada (Maio/2026)</div>
<div class="kpi-grid">
  ${kpi('Receita e-com', E.receita)}
  ${kpi('Pedidos e-com', E.vendas)}
  ${kpi('Visitas e-com', E.visitas)}
  ${kpi('Conversão e-com', E.conversao)}
</div>

<div class="two-col" style="margin-top:8px;">
  <div class="card">
    <div class="card-title">Produtos mais vendidos (Faturamento Bruto)</div>
    ${E.maisVendidos.map(barRow).join('')}
  </div>
  <div class="card">
    <div class="card-title">Status e Faturamento Físico Conciliado</div>
    ${E.statusPedidos.map(p => `<div class="stat-row"><span>${p.nome}</span><span class="stat-val"><span class="badge badge-${p.badge}">${p.texto}</span></span></div>`).join('')}
    <div style="margin-top:12px;font-size:11px;color:var(--faint);">${E.statusRodape}</div>
  </div>
</div>

<div class="two-col" style="margin-top:8px;">
  <div class="card">
    <div class="card-title">Páginas de Produtos Mais Vistas (GA)</div>
    ${E.maisVistos.map(barRow).join('')}
  </div>
  <div class="card">
    <div class="card-title">Termos mais buscados internamente</div>
    ${E.buscas.map(b => `<div class="bar-row"><span class="lbl">${b.nome}</span><div class="bar-track"><div class="bar-fill" style="width:${b.pct}%;background:var(--purple);"></div></div><span class="bar-val">${b.val}</span></div>`).join('')}
  </div>
</div>

<div class="section-title">📊 Evolução Geral de Tráfego do Site (GA4)</div>
<div class="two-col">
  <div class="card">
    <div class="card-title">Evolução Mensal de Sessões Totais</div>
    <div class="chart-wrap"><canvas id="sessoesGaChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Duração Média das Sessões (Segundos)</div>
    <div class="chart-wrap"><canvas id="duracaoGaChart"></canvas></div>
  </div>
</div>

<div class="section-title">📱 Redes Sociais — Histórico Instagram (2026)</div>
<div class="two-col">
  <div class="card">
    <div class="card-title">Evolução de Impressões / Visualizações (mil)</div>
    <div class="chart-wrap"><canvas id="instaVisuChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Alcance de Contas Únicas (mil)</div>
    <div class="chart-wrap"><canvas id="instaAlcaChart"></canvas></div>
  </div>
</div>

<div class="section-title">📧 E-mail Marketing &amp; Captação RD Station (Maio/2026)</div>
<div class="kpi-grid-2" style="margin-bottom:8px;">
  ${kpi('Leads — Pop-up de Saída (Site)', R.leadsPopup)}
  ${kpi('Leads — Botão WhatsApp Flutuante', R.leadsWhatsapp)}
</div>

<div class="two-col">
  <div class="card">
    <div class="card-title">Fontes de Atração dos Novos Leads (RD)</div>
    ${R.fontesLeads.map(b => `<div class="bar-row"><span class="lbl">${b.nome}</span><div class="bar-track"><div class="bar-fill" style="width:${b.pct}%;background:var(--green);"></div></div><span class="bar-val">${b.val} Leads</span></div>`).join('')}
  </div>
  <div class="card">
    <div class="card-title">Disparos de E-mail de Maio</div>
    <table>
      <thead><tr><th>Campanha</th><th>Data</th><th>Enviados</th><th>Abertura</th><th>Cliques</th></tr></thead>
      <tbody>
        ${D.email.campanhasAbril.map(c => `<tr><td>${c.nome}</td><td>${c.data}</td><td>${c.enviados}</td><td>${c.abertura}</td><td>${c.cliques}</td></tr>`).join('')}
      </tbody>
    </table>
  </div>
</div>

<div class="section-title">🚨 Alertas, Insights e Oportunidades</div>
<div class="card">
  <table>
    <thead><tr><th>Situação Analisada</th><th>Prioridade</th><th>Ação sugerida</th></tr></thead>
    <tbody>
      ${D.alertas.map(a => `<tr><td style="color:var(--muted);">${a.situacao}</td><td><span class="badge badge-${a.badge}">${a.prioridade}</span></td><td>${a.acao}</td></tr>`).join('')}
    </tbody>
  </table>
</div>

<footer>Dashboard Comercial e de Marketing · Atualizado em ${D.atualizadoEm}</footer>
`;

const green = '#1D9E75', pink = '#D4537E', purple = '#7F77DD', amber = '#EF9F27', blue = '#378ADD', gray = '#777777';
const gridColor = 'rgba(255,255,255,0.06)', tickColor = 'rgba(255,255,255,0.35)';
const commonScales = {
  x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } },
  y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
};

/* 🚀 GRÁFICO NOVO: Comparativo Multibarras de Canais Mês a Mês */
new Chart(document.getElementById('canaisComparativoChart'), {
  type: 'bar',
  data: {
    labels: H.labels,
    datasets: [
      { label: 'Paid Search (Mídia Paga)', data: H.canaisPorMes.paidSearch, backgroundColor: blue, borderRadius: 3 },
      { label: 'Direct (Acesso Direto)', data: H.canaisPorMes.direct, backgroundColor: purple, borderRadius: 3 },
      { label: 'Organic Search (Google SEO)', data: H.canaisPorMes.organicSearch, backgroundColor: green, borderRadius: 3 },
      { label: 'Social (Redes Sociais)', data: H.canaisPorMes.social, backgroundColor: pink, borderRadius: 3 }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top', labels: { color: '#fff', font: { size: 11 }, boxWidth: 12 } }
    },
    scales: commonScales
  }
});

// Sessões Totais GA
new Chart(document.getElementById('sessoesGaChart'), {
  type: 'bar',
  data: {
    labels: H.labels,
    datasets: [{ label: 'Sessões', data: H.visitasGa, backgroundColor: purple+'66', borderColor: purple, borderWidth: 1, borderRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: commonScales }
});

// Duração de Sessão
new Chart(document.getElementById('duracaoGaChart'), {
  type: 'line',
  data: {
    labels: H.labels,
    datasets: [{ label: 'Duração Média (s)', data: H.duracaoGa, borderColor: amber, backgroundColor: amber+'15', fill: true, tension: 0.3, pointRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: commonScales }
});

// Instagram Visualizações
new Chart(document.getElementById('instaVisuChart'), {
  type: 'bar',
  data: {
    labels: H.labels,
    datasets: [{ label: 'Visualizações (mil)', data: H.instaVisu, backgroundColor: pink, borderRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: commonScales }
});

// Instagram Alcance
new Chart(document.getElementById('instaAlcaChart'), {
  type: 'line',
  data: {
    labels: H.labels,
    datasets: [{ label: 'Alcance (mil)', data: H.instaAlca, borderColor: green, backgroundColor: green+'15', fill: true, tension: 0.3, pointRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: commonScales }
});
</script>
</body>
</html>
